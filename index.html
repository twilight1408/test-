<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Runner</title>

<style>
body{
    margin:0;
    background:#1e1e2f;
    color:white;
    font-family:Arial, sans-serif;
    overflow:hidden;
}

#score{
    position:absolute;
    top:10px;
    left:10px;
    font-size:24px;
}

#questionBox{
    position:absolute;
    top:45%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

#question{
    font-size:32px;
    margin-bottom:20px;
}

.answer{
    position:absolute;
    top:80px;
    padding:10px 20px;
    border-radius:10px;
    background:#4CAF50;
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
    font-size:22px;
}

.correct{
    background:#4CAF50;
}

.wrong{
    background:#f44336;
}

#result{
    display:none;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

button{
    padding:10px 20px;
    font-size:18px;
    cursor:pointer;
}
</style>

</head>
<body>

<div id="score">Điểm: 0</div>

<div id="questionBox">
    <div id="question"></div>
</div>

<div id="result">
    <h1>Hoàn thành!</h1>
    <h2 id="finalScore"></h2>
    <button onclick="location.reload()">Chơi lại</button>
</div>

<script>

const questions = [
{
    question:"2 + 2 bằng mấy?",
    answers:["3","4","5","6"],
    correct:"4"
},
{
    question:"Thủ đô Việt Nam?",
    answers:["Huế","Hà Nội","Đà Nẵng","Cần Thơ"],
    correct:"Hà Nội"
},
{
    question:"Mặt trời mọc ở hướng nào?",
    answers:["Tây","Đông","Nam","Bắc"],
    correct:"Đông"
}
];

let currentQuestion = 0;
let score = 0;

function loadQuestion(){

    document.querySelectorAll(".answer").forEach(e=>e.remove());

    if(currentQuestion >= questions.length){
        endGame();
        return;
    }

    const q = questions[currentQuestion];

    document.getElementById("question").textContent = q.question;

    q.answers.forEach(answerText => {

        const answer = document.createElement("div");
        answer.classList.add("answer");

        answer.textContent = answerText;

        answer.style.left = window.innerWidth + Math.random()*500 + "px";

        answer.style.top = (50 + Math.random()*120) + "px";

        document.body.appendChild(answer);

        let speed = 2 + Math.random()*2;

        const move = setInterval(()=>{

            let currentLeft = parseFloat(answer.style.left);

            answer.style.left = currentLeft - speed + "px";

            if(currentLeft < -150){
                answer.style.left = window.innerWidth + "px";
            }

        },16);

        answer.onclick = ()=>{

            clearInterval(move);

            if(answerText === q.correct){
                score++;
                document.getElementById("score").textContent =
                "Điểm: " + score;
            }

            document.querySelectorAll(".answer").forEach(e=>e.remove());

            currentQuestion++;

            setTimeout(loadQuestion,300);
        };

    });

}

function endGame(){

    document.getElementById("questionBox").style.display = "none";

    document.getElementById("result").style.display = "block";

    document.getElementById("finalScore").textContent =
    `Bạn đạt ${score}/${questions.length} điểm`;

}

loadQuestion();

</script>

</body>
</html>
